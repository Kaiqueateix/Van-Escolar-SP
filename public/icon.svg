<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="112" fill="#10263b"/>
  <!-- Decorative stripe -->
  <path d="M 0 380 L 512 380 L 512 404 L 0 404 Z" fill="#ffc400"/>
  <!-- Van Body -->
  <g transform="translate(64, 110)">
    <!-- Main Body Yellow -->
    <rect x="20" y="70" width="344" height="150" rx="26" fill="#ffc400"/>
    <path d="M 280 70 L 340 120 L 364 120 L 364 220 L 280 220 Z" fill="#ffc400"/>
    <!-- Navy Blue stripe -->
    <rect x="20" y="150" width="344" height="24" fill="#10263b"/>
    <!-- SP Badge / Text -->
    <text x="180" y="167" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="2">VAN ESCOLAR SP</text>
    <!-- Windows -->
    <rect x="50" y="90" width="56" height="46" rx="8" fill="#10263b" opacity="0.85"/>
    <rect x="120" y="90" width="60" height="46" rx="8" fill="#10263b" opacity="0.85"/>
    <rect x="194" y="90" width="60" height="46" rx="8" fill="#10263b" opacity="0.85"/>
    <path d="M 268 90 L 320 90 L 338 136 L 268 136 Z" rx="6" fill="#10263b" opacity="0.85"/>
    <!-- Headlight -->
    <circle cx="356" cy="184" r="10" fill="#ffffff"/>
    <circle cx="356" cy="184" r="6" fill="#ffeb3b"/>
    <!-- Wheels -->
    <circle cx="95" cy="220" r="38" fill="#1e293b"/>
    <circle cx="95" cy="220" r="20" fill="#94a3b8"/>
    <circle cx="95" cy="220" r="10" fill="#0f172a"/>
    <circle cx="285" cy="220" r="38" fill="#1e293b"/>
    <circle cx="285" cy="220" r="20" fill="#94a3b8"/>
    <circle cx="285" cy="220" r="10" fill="#0f172a"/>
    <!-- Checkmark / Verified Badge -->
    <g transform="translate(300, 20)">
      <circle cx="30" cy="30" r="26" fill="#1b8a52" stroke="#ffffff" stroke-width="4"/>
      <path d="M 20 30 L 27 37 L 42 22" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
